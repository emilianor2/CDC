<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/club.webmanifest">
  <title>Club de Fans — Ingresar</title>
  <style></style>
</head>
<body>
  <div class="customer-shell">
    <header>
      <div class="brand"><span>f.</span><div>club de fans<small>Clientes que vuelven.</small></div></div>
    </header>
    <main class="panel account-panel">
      <p class="overline">Entorno de prueba</p>
      <h1>Ingresá a Club de Fans.</h1>
      <form action="/login" method="post" class="stack">
        <input id="next" name="next" type="hidden" value="/">
        <div><label for="email">Correo</label><input id="email" name="email" type="email" autocomplete="username" required maxlength="160"></div>
        <div><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"></div>
        <button class="full" type="submit">Ingresar</button>
        <p id="login-error" role="alert" hidden></p>
      </form>
    </main>
  </div>
  <script>
    const query = new URLSearchParams(location.search);
    document.querySelector('#next').value = query.get('next') || '/';
    const message = {
      credentials: 'Revisá el correo y la contraseña de la cuenta de prueba.',
      unavailable: 'El acceso de prueba no está disponible en este momento. Volvé a intentar.',
    }[query.get('error')];
    if (message) {
      const error = document.querySelector('#login-error');
      error.hidden = false;
      error.textContent = message;
    }
  </script>
</body>
</html>
