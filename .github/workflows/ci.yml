name: Club de Fans CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Pruebas y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci --include=dev --include=optional

      - name: Ejecutar pruebas
        run: node --test db/relational-migration.test.mjs lib/*.test.mjs

      - name: Compilar Worker
        run: |
          npm run build
          test -s dist/server/index.js
          test -s dist/server/wrangler.json

      - name: Guardar versión del commit
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: club-de-fans-${{ github.sha }}
          path: |
            dist/
            drizzle/*.sql
          if-no-files-found: error
          retention-days: 30
